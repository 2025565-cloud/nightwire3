<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Messaging Website</title>

  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #08090d;
  color: white;
}

/* =========================
   LOGIN SCREEN
   ========================= */

#auth {
  min-height: 100vh;
  max-width: 500px;
  margin: auto;
  padding: 80px 20px;

  display: flex;
  flex-direction: column;
  justify-content: center;
}

#auth h1 {
  text-align: center;
  margin-bottom: 35px;
  font-size: 30px;
  letter-spacing: 1px;

  text-shadow:
    0 0 10px rgba(88, 101, 242, 0.6);
}

#auth input {
  width: 100%;
  padding: 15px;
  margin: 7px 0;

  border: 1px solid #292d3a;
  outline: none;
  border-radius: 10px;

  background: #15171f;
  color: white;

  font-size: 15px;

  transition: 0.2s;
}

#auth input:focus {
  border-color: #5865f2;

  box-shadow:
    0 0 0 2px rgba(88, 101, 242, 0.2),
    0 0 15px rgba(88, 101, 242, 0.15);
}

#auth button {
  padding: 12px 22px;
  margin: 12px 4px;

  border: none;
  border-radius: 20px;

  background: #5865f2;
  color: white;

  cursor: pointer;
  font-size: 14px;
  font-weight: bold;

  transition: 0.2s;
}

#auth button:hover {
  background: #4752c4;
  transform: translateY(-2px);
}

#status {
  text-align: center;
  color: #aaa;
  min-height: 20px;
  margin-top: 15px;
}

/* =========================
   CHAT
   ========================= */

#chat {
  width: 100%;
  height: 100vh;

  display: none;
  flex-direction: column;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(88, 101, 242, 0.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 90%,
      rgba(120, 50, 150, 0.10),
      transparent 30%
    ),
    #08090d;
}

/* =========================
   HEADER
   ========================= */

.chat-header {
  height: 72px;
  min-height: 72px;

  display: flex;
  align-items: center;

  gap: 12px;
  padding: 0 20px;

  background: rgba(13, 15, 21, 0.96);

  border-bottom: 1px solid #292d3a;

  box-shadow:
    0 4px 20px rgba(0, 0, 0, 0.35);

  backdrop-filter: blur(10px);
}

.server-icon {
  width: 44px;
  height: 44px;
  min-width: 44px;

  border-radius: 13px;

  background: #5865f2;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 18px;

  box-shadow:
    0 0 15px rgba(88, 101, 242, 0.35);
}

.chat-info {
  display: flex;
  flex-direction: column;
}

.chat-title {
  font-size: 17px;
  font-weight: bold;
}

.chat-status {
  font-size: 12px;
  color: #57f287;
  margin-top: 3px;
}

/* =========================
   PROFILE PICTURE
   ========================= */

.profile-setup {
  margin-left: auto;

  display: flex;
  align-items: center;
  gap: 6px;
}

.profile-setup input {
  max-width: 160px;

  color: #8f96a3;
  font-size: 11px;
}

.profile-setup button {
  width: 38px;
  height: 38px;

  border: none;
  border-radius: 50%;

  background: #252936;
  color: white;

  cursor: pointer;

  transition: 0.2s;
}

.profile-setup button:hover {
  background: #5865f2;
  transform: scale(1.08);
}

/* =========================
   LOGOUT
   ========================= */

.logout-button {
  padding: 9px 14px;

  border: none;
  border-radius: 18px;

  background: #252936;
  color: #b5bac1;

  cursor: pointer;

  transition: 0.2s;
}

.logout-button:hover {
  background: #ed4245;
  color: white;
  transform: translateY(-1px);
}

/* =========================
   MESSAGES
   ========================= */

#messages {
  flex: 1;

  display: flex;
  flex-direction: column;
  gap: 16px;

  padding: 25px;

  overflow-y: auto;

  scroll-behavior: smooth;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;

  max-width: 80%;

  animation: messageAppear 0.2s ease;
}

@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message-row.mine {
  align-self: flex-end;
  flex-direction: row-reverse;
}

/* =========================
   AVATAR
   ========================= */

.avatar {
  width: 40px;
  height: 40px;
  min-width: 40px;

  border-radius: 50%;

  background: #5865f2;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 14px;

  position: relative;

  overflow: hidden;

  border: 2px solid #303442;
}

.avatar img {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.avatar::after {
  content: "";

  position: absolute;

  inset: 0;

  border-radius: 50%;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08);

  pointer-events: none;
}

/* =========================
   MESSAGE CONTENT
   ========================= */

.message-content {
  display: flex;
  flex-direction: column;

  min-width: 0;
}

.message-row.mine .message-content {
  align-items: flex-end;
}

.message-username {
  font-size: 12px;

  color: #aeb4c0;

  margin: 0 0 5px 8px;

  font-weight: bold;
}

/* =========================
   MESSAGE BUBBLE
   ========================= */

.message {
  max-width: 100%;

  padding: 11px 15px;

  border-radius: 17px;

  background: #1b1e27;

  color: #f2f3f5;

  word-wrap: break-word;

  border: 1px solid #292d3a;

  box-shadow:
    0 3px 10px rgba(0, 0, 0, 0.25);

  transition: 0.2s;
}

.message:hover {
  border-color: #3a3f50;
}

.message-row.mine .message {
  background: #5865f2;

  color: white;

  border: none;

  border-bottom-right-radius: 5px;

  box-shadow:
    0 3px 12px rgba(88, 101, 242, 0.2);
}

.message-row:not(.mine) .message {
  border-bottom-left-radius: 5px;
}

.message-text {
  font-size: 15px;
  line-height: 1.45;
}

.message-time {
  font-size: 10px;

  color: #747b89;

  margin-top: 5px;

  padding: 0 4px;
}

/* =========================
   EDIT BUTTON
   ========================= */

.edit-button {
  margin-top: 5px;

  border: none;
  background: transparent;

  color: #747b89;

  font-size: 10px;

  cursor: pointer;

  padding: 2px 5px;

  transition: 0.2s;
}

.edit-button:hover {
  color: #5865f2;
}
    .message-actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.edit-button,
.delete-button {
  border: none;
  background: transparent;
  font-size: 10px;
  cursor: pointer;
  padding: 2px 5px;
  transition: 0.2s;
}

.edit-button {
  color: #747b89;
}

.edit-button:hover {
  color: #5865f2;
}

.delete-button {
  color: #747b89;
}

.delete-button:hover {
  color: #ed4245;
}

/* =========================
   READ RECEIPTS
   ========================= */

.read-receipt {
  font-size: 10px;

  margin-top: 3px;

  color: #8f96a3;
}

/* =========================
   EDITED LABEL
   ========================= */

.edited-label {
  font-size: 10px;

  color: #8f96a3;

  margin-left: 4px;

  font-style: italic;
}

/* =========================
   TYPING INDICATOR
   ========================= */

#typingIndicator {
  min-height: 22px;

  padding: 0 25px 7px;

  font-size: 12px;

  color: #8f96a3;

  font-style: italic;
}

/* =========================
   MESSAGE INPUT
   ========================= */

.send-area {
  display: flex;

  gap: 10px;

  padding: 15px 20px;

  background: #0d0f15;

  border-top: 1px solid #292d3a;
}

#messageInput {
  flex: 1;

  height: 48px;

  padding: 0 18px;

  border: 1px solid #292d3a;

  outline: none;

  border-radius: 24px;

  background: #171a22;

  color: white;

  font-size: 15px;

  transition: 0.2s;
}

#messageInput::placeholder {
  color: #6f7582;
}

#messageInput:focus {
  border-color: #5865f2;

  box-shadow:
    0 0 0 2px rgba(88, 101, 242, 0.15);
}

.send-area button {
  width: 48px;
  height: 48px;

  border: none;
  border-radius: 50%;

  background: #5865f2;

  color: white;

  font-size: 20px;

  cursor: pointer;

  transition: 0.2s;
}

.send-area button:hover {
  background: #4752c4;

  transform: scale(1.08);

  box-shadow:
    0 0 15px rgba(88, 101, 242, 0.35);
}

.send-area button:active {
  transform: scale(0.95);
}

/* =========================
   SCROLLBAR
   ========================= */

#messages::-webkit-scrollbar {
  width: 7px;
}

#messages::-webkit-scrollbar-track {
  background: transparent;
}

#messages::-webkit-scrollbar-thumb {
  background: #303442;

  border-radius: 10px;
}

#messages::-webkit-scrollbar-thumb:hover {
  background: #454b5c;
}
    
/* =========================
   PROFILE PANEL
   ========================= */

.profile-button {
  padding: 9px 14px;
  border: none;
  border-radius: 18px;
  background: #252936;
  color: #b5bac1;
  cursor: pointer;
  transition: 0.2s;
}

.profile-button:hover {
  background: #5865f2;
  color: white;
  transform: translateY(-1px);
}

.profile-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;

  align-items: center;
  justify-content: center;

  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
}

.profile-box {
  width: min(400px, 90%);
  padding: 25px;

  background: #15171f;
  border: 1px solid #292d3a;
  border-radius: 18px;

  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}

.profile-box h2 {
  margin-top: 0;
  margin-bottom: 20px;
}

.profile-box input,
.profile-box textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;

  border: 1px solid #292d3a;
  border-radius: 10px;

  background: #0d0f15;
  color: white;

  outline: none;
  font-family: Arial, sans-serif;
}

.profile-box textarea {
  height: 90px;
  resize: none;
}

.profile-box input:focus,
.profile-box textarea:focus {
  border-color: #5865f2;
}

.profile-buttons {
  display: flex;
  gap: 8px;
}

.profile-buttons button {
  flex: 1;
  padding: 10px;

  border: none;
  border-radius: 10px;

  background: #5865f2;
  color: white;

  cursor: pointer;
  font-weight: bold;
}

.profile-buttons button:last-child {
  background: #252936;
}

#profileStatus {
  text-align: center;
  color: #8f96a3;
  font-size: 12px;
  min-height: 15px;
}
    
/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

  #auth {
    padding: 40px 18px;
  }

  #auth h1 {
    font-size: 25px;
  }

  #messages {
    padding: 14px;
    gap: 12px;
  }

  .message-row {
    max-width: 90%;
  }

  .chat-header {
    padding: 0 10px;
  }

  .server-icon {
    width: 38px;
    height: 38px;
    min-width: 38px;
  }

  .chat-title {
    font-size: 15px;
  }

  .profile-setup input {
    display: none;
  }

  .logout-button {
    padding: 8px 10px;
    font-size: 11px;
  }

  .send-area {
    padding: 10px;
  }

  #messageInput {
    height: 44px;
  }

  .send-area button {
    width: 44px;
    height: 44px;
  }
}
    .message-actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.edit-button,
.delete-button {
  border: none;
  background: transparent;
  font-size: 10px;
  cursor: pointer;
  padding: 2px 5px;
  transition: 0.2s;
}

.edit-button {
  color: #747b89;
}

.edit-button:hover {
  color: #5865f2;
}

.delete-button {
  color: #747b89;
}

.delete-button:hover {
  color: #ed4245;
}
    .reaction-bar {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}

.reaction-button {
  background: #2b2d31;
  border: 1px solid #40444b;
  border-radius: 8px;
  padding: 4px 7px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.15s;
}

.reaction-button:hover {
  transform: scale(1.15);
  background: #40444b;
}
    .reaction-button.my-reaction {
  background: #5865f2;
  border-color: #7289da;
}
    .message-image {
  display: block;
  max-width: 280px;
  max-height: 350px;
  width: auto;
  height: auto;
  border-radius: 12px;
  margin-top: 8px;
  cursor: pointer;
}
    .image-preview {
  position: relative;
  display: inline-block;
  margin: 10px;
  padding: 6px;
  background: #1e1f22;
  border: 1px solid #40444b;
  border-radius: 12px;
}

.image-preview img {
  display: block;
  max-width: 220px;
  max-height: 180px;
  border-radius: 8px;
}

.remove-preview {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 25px;
  height: 25px;
  border: none;
  border-radius: 50%;
  background: #ed4245;
  color: white;
  font-size: 14px;

}
    .replied-message {
  background: #2b2d31;
  border-left: 3px solid #5865f2;
  padding: 6px 9px;
  margin-bottom: 7px;
  border-radius: 6px;
  font-size: 12px;
  opacity: 0.85;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
    
    .private-user-button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 6px;

  background: #2b2d31;
  color: white;

  border: 1px solid #40444b;
  border-radius: 8px;

  cursor: pointer;
  text-align: left;

  transition: 0.15s;
}

.private-user-button:hover {
  background: #40444b;
}

.private-user-avatar {
  width: 40px;
  height: 40px;

  border-radius: 50%;
  object-fit: cover;

  background: #1e1f22;
}

.private-user-button span {
  font-size: 15px;
  font-weight: 600;
}

const typingChannel =

let typingTimeout;

typingChannel
  .on(

    { event: "sync" },

async function setTyping(isTyping) {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  await typingChannel.track({
    user_id: user.id,
    username: user.email.split("@")[0],
    typing: isTyping
  });
}


function updateTypingIndicator() {

  const indicator =
    document.getElementById("typingIndicator");

  if (!indicator) {
    return;
  }

  const presence =
    typingChannel.presenceState();

  const typingUsers = [];

  Object.values(presence).forEach(
    presences => {

      presences.forEach(
        presence => {

          if (presence.typing === true) {

            typingUsers.push(
              presence.username
            );

          }

        }
      );

    }
  );

  if (typingUsers.length === 0) {

    indicator.textContent = "";

  } else if (typingUsers.length === 1) {

    indicator.textContent =
      typingUsers[0] +
      " is typing...";

  } else {

    indicator.textContent =
      typingUsers.length +
      " people are typing...";

  }
}
// ==============================
// ONLINE / OFFLINE STATUS
// ==============================

const onlineStatus =
  document.getElementById("onlineStatus");

function updateOnlineStatus() {

  if (!onlineStatus) {
    return;
  }

  if (navigator.onLine) {

    onlineStatus.textContent =
      "● Online";

    onlineStatus.style.color =
      "#57f287";

  } else {

    onlineStatus.textContent =
      "● Offline";

    onlineStatus.style.color =
      "#ed4245";

  }
}

window.addEventListener(
  "online",
  updateOnlineStatus
);

window.addEventListener(
  "offline",
  updateOnlineStatus
);

async function requestNotifications() {

async function uploadAvatar() {

  const fileInput =
    document.getElementById("avatarInput");

  const file =
    fileInput.files[0];

  if (!file) {
    statusText.textContent =
      "Choose a picture first.";
    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    statusText.textContent =
      "You need to log in first.";
    return;
  }

  const fileName =
    user.id + "-" +
    Date.now() + "-" +
    file.name;

  const { error } =
    await supabaseClient.storage
      .from("avatars")
      .upload(fileName, file);

  if (error) {
    statusText.textContent =
      "Upload error: " +
      error.message;
    return;
  }

  const { data: publicUrlData } =
    supabaseClient.storage
      .from("avatars")
      .getPublicUrl(fileName);

  const avatarUrl =
    publicUrlData.publicUrl;

  localStorage.setItem(
    "avatarUrl",
    avatarUrl
  );

  statusText.textContent =
    "Profile picture uploaded! 📸";
}

async function saveProfile() {

    input.value.trim();

    imageInput.files[0];

  if (!text && !file) {
    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

    return;
  }

.insert({

  image_url: imageUrl,

 input.value = "";

async function editMessage(messageId, oldMessage) {

  const newMessage =
    prompt(
      "Edit your message:",
      oldMessage
    );

  if (newMessage === null) {
    return;
  }

  const text =
    newMessage.trim();

  if (!text) {
    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("messages")
      .update({
        message: text,
        edited_at: new Date().toISOString()
      })
      .eq('"Id"', messageId)
      .eq("user_id", user.id);

  if (error) {

    alert(
      "Edit error:\n\n" +
      error.message
    );

    console.log(error);
    return;
  }

  loadMessages();
}

  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {

  }

  const { error } =
    await supabaseClient
      .from("messages")
      .delete()
      .eq('"Id"', messageId)
      .eq("user_id", user.id);

  if (error) {

    alert(
      "Delete error:\n\n" +
      error.message
    );

  .on(

   async function toggleReaction(
  messageId,
  reaction
) {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const {
    data: existingReaction,
    error: findError
  } =
    await supabaseClient
      .from("message_reactions")
      .select("id")
      .eq("message_id", messageId)
      .eq("user_id", user.id)
      .eq("reaction", reaction);

  if (findError) {

    console.log(
      "Reaction check error:",
      findError
    );

    return;
  }

  if (
    existingReaction &&
    existingReaction.length > 0
  ) {

    await supabaseClient
      .from("message_reactions")
      .delete()
      .eq("id", existingReaction[0].id);

  } else {

    await supabaseClient
      .from("message_reactions")
      .insert({
        message_id: messageId,
        user_id: user.id,
        reaction: reaction
      });

  }

  loadMessages();
}

  const {
    data: profiles,
    error

    await supabaseClient
      .from("profiles")
      .select("id, username, avatar_url")
      .neq("id", user.id)
      .order("username");

      "Private users error:",
