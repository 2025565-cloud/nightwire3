<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Messaging Website</title>

  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #08090d;
  color: white;
}

/* =========================
   LOGIN SCREEN
   ========================= */

#auth {
  min-height: 100vh;
  max-width: 500px;
  margin: auto;
  padding: 80px 20px;

  display: flex;
  flex-direction: column;
  justify-content: center;
}

#auth h1 {
  text-align: center;
  margin-bottom: 35px;
  font-size: 30px;
  letter-spacing: 1px;

  text-shadow:
    0 0 10px rgba(88, 101, 242, 0.6);
}

#auth input {
  width: 100%;
  padding: 15px;
  margin: 7px 0;

  border: 1px solid #292d3a;
  outline: none;
  border-radius: 10px;

  background: #15171f;
  color: white;

  font-size: 15px;

  transition: 0.2s;
}

#auth input:focus {
  border-color: #5865f2;

  box-shadow:
    0 0 0 2px rgba(88, 101, 242, 0.2),
    0 0 15px rgba(88, 101, 242, 0.15);
}

#auth button {
  padding: 12px 22px;
  margin: 12px 4px;

  border: none;
  border-radius: 20px;

  background: #5865f2;
  color: white;

  cursor: pointer;
  font-size: 14px;
  font-weight: bold;

  transition: 0.2s;
}

#auth button:hover {
  background: #4752c4;
  transform: translateY(-2px);
}

#status {
  text-align: center;
  color: #aaa;
  min-height: 20px;
  margin-top: 15px;
}

/* =========================
   CHAT
   ========================= */

#chat {
  width: 100%;
  height: 100vh;

  display: none;
  flex-direction: column;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(88, 101, 242, 0.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 90%,
      rgba(120, 50, 150, 0.10),
      transparent 30%
    ),
    #08090d;
}

/* =========================
   HEADER
   ========================= */

.chat-header {
  height: 72px;
  min-height: 72px;

  display: flex;
  align-items: center;

  gap: 12px;
  padding: 0 20px;

  background: rgba(13, 15, 21, 0.96);

  border-bottom: 1px solid #292d3a;

  box-shadow:
    0 4px 20px rgba(0, 0, 0, 0.35);

  backdrop-filter: blur(10px);
}

.server-icon {
  width: 44px;
  height: 44px;
  min-width: 44px;

  border-radius: 13px;

  background: #5865f2;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 18px;

  box-shadow:
    0 0 15px rgba(88, 101, 242, 0.35);
}

.chat-info {
  display: flex;
  flex-direction: column;
}

.chat-title {
  font-size: 17px;
  font-weight: bold;
}

.chat-status {
  font-size: 12px;
  color: #57f287;
  margin-top: 3px;
}

/* =========================
   PROFILE PICTURE
   ========================= */

.profile-setup {
  margin-left: auto;

  display: flex;
  align-items: center;
  gap: 6px;
}

.profile-setup input {
  max-width: 160px;

  color: #8f96a3;
  font-size: 11px;
}

.profile-setup button {
  width: 38px;
  height: 38px;

  border: none;
  border-radius: 50%;

  background: #252936;
  color: white;

  cursor: pointer;

  transition: 0.2s;
}

.profile-setup button:hover {
  background: #5865f2;
  transform: scale(1.08);
}

/* =========================
   LOGOUT
   ========================= */

.logout-button {
  padding: 9px 14px;

  border: none;
  border-radius: 18px;

  background: #252936;
  color: #b5bac1;

  cursor: pointer;

  transition: 0.2s;
}

.logout-button:hover {
  background: #ed4245;
  color: white;
  transform: translateY(-1px);
}

/* =========================
   MESSAGES
   ========================= */

#messages {
  flex: 1;

  display: flex;
  flex-direction: column;
  gap: 16px;

  padding: 25px;

  overflow-y: auto;

  scroll-behavior: smooth;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;

  max-width: 80%;

  animation: messageAppear 0.2s ease;
}

@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message-row.mine {
  align-self: flex-end;
  flex-direction: row-reverse;
}

/* =========================
   AVATAR
   ========================= */

.avatar {
  width: 40px;
  height: 40px;
  min-width: 40px;

  border-radius: 50%;

  background: #5865f2;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 14px;

  position: relative;

  overflow: hidden;

  border: 2px solid #303442;
}

.avatar img {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.avatar::after {
  content: "";

  position: absolute;

  inset: 0;

  border-radius: 50%;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08);

  pointer-events: none;
}

/* =========================
   MESSAGE CONTENT
   ========================= */

.message-content {
  display: flex;
  flex-direction: column;

  min-width: 0;
}

.message-row.mine .message-content {
  align-items: flex-end;
}

.message-username {
  font-size: 12px;

  color: #aeb4c0;

  margin: 0 0 5px 8px;

  font-weight: bold;
}

/* =========================
   MESSAGE BUBBLE
   ========================= */

.message {
  max-width: 100%;

  padding: 11px 15px;

  border-radius: 17px;

  background: #1b1e27;

  color: #f2f3f5;

  word-wrap: break-word;

  border: 1px solid #292d3a;

  box-shadow:
    0 3px 10px rgba(0, 0, 0, 0.25);

  transition: 0.2s;
}

.message:hover {
  border-color: #3a3f50;
}

.message-row.mine .message {
  background: #5865f2;

  color: white;

  border: none;

  border-bottom-right-radius: 5px;

  box-shadow:
    0 3px 12px rgba(88, 101, 242, 0.2);
}

.message-row:not(.mine) .message {
  border-bottom-left-radius: 5px;
}

.message-text {
  font-size: 15px;
  line-height: 1.45;
}

.message-time {
  font-size: 10px;

  color: #747b89;

  margin-top: 5px;

  padding: 0 4px;
}

/* =========================
   EDIT BUTTON
   ========================= */

.edit-button {
  margin-top: 5px;

  border: none;
  background: transparent;

  color: #747b89;

  font-size: 10px;

  cursor: pointer;

  padding: 2px 5px;

  transition: 0.2s;
}

.edit-button:hover {
  color: #5865f2;
}
    .message-actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.edit-button,
.delete-button {
  border: none;
  background: transparent;
  font-size: 10px;
  cursor: pointer;
  padding: 2px 5px;
  transition: 0.2s;
}

.edit-button {
  color: #747b89;
}

.edit-button:hover {
  color: #5865f2;
}

.delete-button {
  color: #747b89;
}

.delete-button:hover {
  color: #ed4245;
}

/* =========================
   READ RECEIPTS
   ========================= */

.read-receipt {
  font-size: 10px;

  margin-top: 3px;

  color: #8f96a3;
}

/* =========================
   EDITED LABEL
   ========================= */

.edited-label {
  font-size: 10px;

  color: #8f96a3;

  margin-left: 4px;

  font-style: italic;
}

/* =========================
   TYPING INDICATOR
   ========================= */

#typingIndicator {
  min-height: 22px;

  padding: 0 25px 7px;

  font-size: 12px;

  color: #8f96a3;

  font-style: italic;
}

/* =========================
   MESSAGE INPUT
   ========================= */

.send-area {
  display: flex;

  gap: 10px;

  padding: 15px 20px;

  background: #0d0f15;

  border-top: 1px solid #292d3a;
}

#messageInput {
  flex: 1;

  height: 48px;

  padding: 0 18px;

  border: 1px solid #292d3a;

  outline: none;

  border-radius: 24px;

  background: #171a22;

  color: white;

  font-size: 15px;

  transition: 0.2s;
}

#messageInput::placeholder {
  color: #6f7582;
}

#messageInput:focus {
  border-color: #5865f2;

  box-shadow:
    0 0 0 2px rgba(88, 101, 242, 0.15);
}

.send-area button {
  width: 48px;
  height: 48px;

  border: none;
  border-radius: 50%;

  background: #5865f2;

  color: white;

  font-size: 20px;

  cursor: pointer;

  transition: 0.2s;
}

.send-area button:hover {
  background: #4752c4;

  transform: scale(1.08);

  box-shadow:
    0 0 15px rgba(88, 101, 242, 0.35);
}

.send-area button:active {
  transform: scale(0.95);
}

/* =========================
   SCROLLBAR
   ========================= */

#messages::-webkit-scrollbar {
  width: 7px;
}

#messages::-webkit-scrollbar-track {
  background: transparent;
}

#messages::-webkit-scrollbar-thumb {
  background: #303442;

  border-radius: 10px;
}

#messages::-webkit-scrollbar-thumb:hover {
  background: #454b5c;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

  #auth {
    padding: 40px 18px;
  }

  #auth h1 {
    font-size: 25px;
  }

  #messages {
    padding: 14px;
    gap: 12px;
  }

  .message-row {
    max-width: 90%;
  }

  .chat-header {
    padding: 0 10px;
  }

  .server-icon {
    width: 38px;
    height: 38px;
    min-width: 38px;
  }

  .chat-title {
    font-size: 15px;
  }

  .profile-setup input {
    display: none;
  }

  .logout-button {
    padding: 8px 10px;
    font-size: 11px;
  }

  .send-area {
    padding: 10px;
  }

  #messageInput {
    height: 44px;
  }

  .send-area button {
    width: 44px;
    height: 44px;
  }
}
    .message-actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.edit-button,
.delete-button {
  border: none;
  background: transparent;
  font-size: 10px;
  cursor: pointer;
  padding: 2px 5px;
  transition: 0.2s;
}

.edit-button {
  color: #747b89;
}

.edit-button:hover {
  color: #5865f2;
}

.delete-button {
  color: #747b89;
}

.delete-button:hover {
  color: #ed4245;
}

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // ==============================
    // SUPABASE INFORMATION
    // ==============================
const SUPABASE_URL =
  "https://iwawfcnfgogfkognlcij.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2r705Lr5VJaXL-R7XcQfFw_FH--UiIh";

const supabaseClient =
  window.supabase.createClient(
 SUPABASE_URL,
  SUPABASE_KEY
  );
// ==============================
// TYPING INDICATOR
// ==============================

const typingChannel =
  supabaseClient.channel("main-chat-typing");

let typingTimeout;

typingChannel
  .on(
    "presence",
    { event: "sync" },
    () => {
      updateTypingIndicator();
    }
  )
  .subscribe(async (status) => {

    if (status === "SUBSCRIBED") {

      const {
        data: { user }
      } =
        await supabaseClient.auth.getUser();

      if (user) {

        await typingChannel.track({
          user_id: user.id,
          username: user.email.split("@")[0],
          typing: false
        });

      }
    }
  });


async function setTyping(isTyping) {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  await typingChannel.track({
    user_id: user.id,
    username: user.email.split("@")[0],
    typing: isTyping
  });
}


function updateTypingIndicator() {

  const indicator =
    document.getElementById("typingIndicator");

  if (!indicator) {
    return;
  }

  const presence =
    typingChannel.presenceState();

  const typingUsers = [];

  Object.values(presence).forEach(
    presences => {

      presences.forEach(
        presence => {

          if (presence.typing === true) {

            typingUsers.push(
              presence.username
            );

          }

        }
      );

    }
  );

  if (typingUsers.length === 0) {

    indicator.textContent = "";

  } else if (typingUsers.length === 1) {

    indicator.textContent =
      typingUsers[0] +
      " is typing...";

  } else {

    indicator.textContent =
      typingUsers.length +
      " people are typing...";

  }
}
// ==============================
// ONLINE / OFFLINE STATUS
// ==============================

const onlineStatus =
  document.getElementById("onlineStatus");

function updateOnlineStatus() {

  if (!onlineStatus) {
    return;
  }

  if (navigator.onLine) {

    onlineStatus.textContent =
      "● Online";

    onlineStatus.style.color =
      "#57f287";

  } else {

    onlineStatus.textContent =
      "● Offline";

    onlineStatus.style.color =
      "#ed4245";

  }
}

window.addEventListener(
  "online",
  updateOnlineStatus
);

window.addEventListener(
  "offline",
  updateOnlineStatus
);

updateOnlineStatus();
    
    const authScreen =
      document.getElementById("auth");

    const chatScreen =
      document.getElementById("chat");

   const statusText =
  document.getElementById("status");


async function uploadAvatar() {

  const fileInput =
    document.getElementById("avatarInput");

  const file =
    fileInput.files[0];

  if (!file) {
    statusText.textContent =
      "Choose a picture first.";
    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    statusText.textContent =
      "You need to log in first.";
    return;
  }

  const fileName =
    user.id + "-" +
    Date.now() + "-" +
    file.name;

  const { error } =
    await supabaseClient.storage
      .from("avatars")
      .upload(fileName, file);

  if (error) {
    statusText.textContent =
      "Upload error: " +
      error.message;
    return;
  }

  const { data: publicUrlData } =
    supabaseClient.storage
      .from("avatars")
      .getPublicUrl(fileName);

  const avatarUrl =
    publicUrlData.publicUrl;

  localStorage.setItem(
    "avatarUrl",
    avatarUrl
  );

  statusText.textContent =
    "Profile picture uploaded! 📸";
}
 

    async function signUp() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {

        statusText.textContent =
          "Enter an email and password.";

        return;
      }

      const { error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {

        statusText.textContent =
          error.message;

      } else {

        statusText.textContent =
          "Account created! You can now log in.";
      }
    }



    async function logIn() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {

        statusText.textContent =
          "Enter an email and password.";

        return;
      }

      statusText.textContent =
        "Logging in...";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        statusText.textContent =
          error.message;

      } else {

        statusText.textContent = "";
      }
    }


    async function logOut() {

      await supabaseClient.auth.signOut();
    }


async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const username =
    user.email.split("@")[0];

  const avatar_url =
    localStorage.getItem("avatarUrl") || null;

  const { error } =
    await supabaseClient
      .from("messages")
      .insert({
        user_id: user.id,
        username: username,
        avatar_url: avatar_url,
        message: text,
        read_at: null
      });

  if (error) {

    alert(
      "ERROR:\n\n" +
      error.message +
      "\n\nCode: " +
      error.code
    );

    console.log(error);
    return;
  }

  input.value = "";

  clearTimeout(typingTimeout);

  await setTyping(false);

  loadMessages();
}


// ==============================
// READ RECEIPTS
// ==============================

async function markMessagesAsRead() {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("messages")
      .update({
        read_at: new Date().toISOString()
      })
      .is("read_at", null)
      .neq("user_id", user.id);

  if (error) {

    console.log(
      "Read receipt error:",
      error
    );

  }
}


// ==============================
// EDIT MESSAGE
// ==============================

async function editMessage(messageId, oldMessage) {

  const newMessage =
    prompt(
      "Edit your message:",
      oldMessage
    );

  if (newMessage === null) {
    return;
  }

  const text =
    newMessage.trim();

  if (!text) {
    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("messages")
      .update({
        message: text,
        edited_at: new Date().toISOString()
      })
      .eq('"Id"', messageId)
      .eq("user_id", user.id);

  if (error) {

    alert(
      "Edit error:\n\n" +
      error.message
    );

    console.log(error);
    return;
  }

  loadMessages();
}


// ==============================
// DELETE MESSAGE
// ==============================

async function deleteMessage(messageId) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this message?"
    );

  if (!confirmed) {
    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("messages")
      .delete()
      .eq('"Id"', messageId)
      .eq("user_id", user.id);

  if (error) {

    alert(
      "Delete error:\n\n" +
      error.message
    );

    console.log(error);
    return;
  }

  loadMessages();
}


// ==============================
// LOAD MESSAGES
// ==============================

async function loadMessages() {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .order(
        "created_at",
        { ascending: true }
      );

  if (error) {

    console.log(
      "LOAD MESSAGES ERROR:",
      error
    );

    return;
  }

  const container =
    document.getElementById("messages");

  container.innerHTML = "";

  data.forEach(item => {

    const row =
      document.createElement("div");

    const isMine =
      user &&
      item.user_id === user.id;

    row.className =
      "message-row" +
      (isMine ? " mine" : "");


    // Avatar

    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    const username =
      item.username || "User";

    if (item.avatar_url) {

      const image =
        document.createElement("img");

      image.src =
        item.avatar_url;

      image.alt =
        username;

      avatar.appendChild(image);

    } else {

      avatar.textContent =
        username
          .charAt(0)
          .toUpperCase();

    }


    // Content

    const content =
      document.createElement("div");

    content.className =
      "message-content";


    // Username

    const name =
      document.createElement("div");

    name.className =
      "message-username";

    name.textContent =
      username;


    // Message bubble

    const bubble =
      document.createElement("div");

    bubble.className =
      "message";


    const text =
      document.createElement("div");

    text.className =
      "message-text";

    text.textContent =
      item.message || "";

    bubble.appendChild(text);


    // Edited label

    if (item.edited_at) {

      const edited =
        document.createElement("span");

      edited.textContent =
        " (edited)";

      edited.className =
        "edited-label";

      text.appendChild(edited);

    }


    // Time

    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      new Date(item.created_at)
        .toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );


    content.appendChild(name);
    content.appendChild(bubble);
    content.appendChild(time);


    // Edit and Delete buttons

    if (isMine) {

      const actions =
        document.createElement("div");

      actions.className =
        "message-actions";


      // Edit button

      const editButton =
        document.createElement("button");

      editButton.textContent =
        "✏️ Edit";

      editButton.className =
        "edit-button";

      editButton.onclick = () => {

        editMessage(
          item.Id,
          item.message
        );

      };


      // Delete button

      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "🗑️ Delete";

      deleteButton.className =
        "delete-button";

      deleteButton.onclick = () => {

        deleteMessage(
          item.Id
        );

      };


      actions.appendChild(
        editButton
      );

      actions.appendChild(
        deleteButton
      );

      content.appendChild(
        actions
      );

    }


    // Read receipt

    if (isMine) {

      const receipt =
        document.createElement("div");

      receipt.className =
        "read-receipt";

      if (item.read_at) {

        receipt.textContent =
          "✓✓ Read";

        receipt.style.color =
          "#57f287";

      } else {

        receipt.textContent =
          "✓ Sent";

      }

      content.appendChild(
        receipt
      );

    }


    row.appendChild(avatar);

    row.appendChild(content);

    container.appendChild(row);

  });


  container.scrollTop =
    container.scrollHeight;
}
    // ==============================
    // SHOW CHAT
    // ==============================

    function showChat() {

  authScreen.style.display =
    "none";

  chatScreen.style.display =
    "flex";

  markMessagesAsRead();

  loadMessages();
}


    // ==============================
    // SHOW LOGIN
    // ==============================

    function showLogin() {

      authScreen.style.display =
        "block";

      chatScreen.style.display =
        "none";
    }


    // ==============================
    // WATCH LOGIN STATUS
    // ==============================

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session) {

          showChat();

        } else {

          showLogin();
        }

      }
    );


    // ==============================
    // ENTER KEY SENDS MESSAGE
    // ==============================

    document
      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            sendMessage();
          }

        }
      );
// ==============================
// DETECT TYPING
// ==============================

document
  .getElementById("messageInput")
  .addEventListener(
    "input",
    function() {

      if (this.value.trim() !== "") {

        setTyping(true);

        clearTimeout(typingTimeout);

        typingTimeout =
          setTimeout(
            () => {
              setTyping(false);
            },
            1500
          );

      } else {

        clearTimeout(typingTimeout);

        setTyping(false);

      }

    }
  );
  </script>
