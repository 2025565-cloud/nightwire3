<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Messaging Website</title>

  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #08090d;
  color: white;
}

/* =========================
   LOGIN SCREEN
   ========================= */

#auth {
  min-height: 100vh;
  max-width: 500px;
  margin: auto;
  padding: 80px 20px;

  display: flex;
  flex-direction: column;
  justify-content: center;
}

#auth h1 {
  text-align: center;
  margin-bottom: 35px;
  font-size: 30px;
  letter-spacing: 1px;

  text-shadow:
    0 0 10px rgba(88, 101, 242, 0.6);
}

#auth input {
  width: 100%;
  padding: 15px;
  margin: 7px 0;

  border: 1px solid #292d3a;
  outline: none;
  border-radius: 10px;

  background: #15171f;
  color: white;

  font-size: 15px;

  transition: 0.2s;
}

#auth input:focus {
  border-color: #5865f2;

  box-shadow:
    0 0 0 2px rgba(88, 101, 242, 0.2),
    0 0 15px rgba(88, 101, 242, 0.15);
}

#auth button {
  padding: 12px 22px;
  margin: 12px 4px;

  border: none;
  border-radius: 20px;

  background: #5865f2;
  color: white;

  cursor: pointer;
  font-size: 14px;
  font-weight: bold;

  transition: 0.2s;
}

#auth button:hover {
  background: #4752c4;
  transform: translateY(-2px);
}

#status {
  text-align: center;
  color: #aaa;
  min-height: 20px;
  margin-top: 15px;
}

/* =========================
   CHAT
   ========================= */

#chat {
  width: 100%;
  height: 100vh;

  display: none;
  flex-direction: column;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(88, 101, 242, 0.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 90%,
      rgba(120, 50, 150, 0.10),
      transparent 30%
    ),
    #08090d;
}

/* =========================
   HEADER
   ========================= */

.chat-header {
  height: 72px;
  min-height: 72px;

  display: flex;
  align-items: center;

  gap: 12px;
  padding: 0 20px;

  background: rgba(13, 15, 21, 0.96);

  border-bottom: 1px solid #292d3a;

  box-shadow:
    0 4px 20px rgba(0, 0, 0, 0.35);

  backdrop-filter: blur(10px);
}

.server-icon {
  width: 44px;
  height: 44px;
  min-width: 44px;

  border-radius: 13px;

  background: #5865f2;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 18px;

  box-shadow:
    0 0 15px rgba(88, 101, 242, 0.35);
}

.chat-info {
  display: flex;
  flex-direction: column;
}

.chat-title {
  font-size: 17px;
  font-weight: bold;
}

.chat-status {
  font-size: 12px;
  color: #57f287;
  margin-top: 3px;
}

/* =========================
   PROFILE PICTURE
   ========================= */

.profile-setup {
  margin-left: auto;

  display: flex;
  align-items: center;
  gap: 6px;
}

.profile-setup input {
  max-width: 160px;

  color: #8f96a3;
  font-size: 11px;
}

.profile-setup button {
  width: 38px;
  height: 38px;

  border: none;
  border-radius: 50%;

  background: #252936;
  color: white;

  cursor: pointer;

  transition: 0.2s;
}

.profile-setup button:hover {
  background: #5865f2;
  transform: scale(1.08);
}

/* =========================
   LOGOUT
   ========================= */

.logout-button {
  padding: 9px 14px;

  border: none;
  border-radius: 18px;

  background: #252936;
  color: #b5bac1;

  cursor: pointer;

  transition: 0.2s;
}

.logout-button:hover {
  background: #ed4245;
  color: white;
  transform: translateY(-1px);
}

/* =========================
   MESSAGES
   ========================= */

#messages {
  flex: 1;

  display: flex;
  flex-direction: column;
  gap: 16px;

  padding: 25px;

  overflow-y: auto;

  scroll-behavior: smooth;
}

.message-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;

  max-width: 80%;

  animation: messageAppear 0.2s ease;
}

@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message-row.mine {
  align-self: flex-end;
  flex-direction: row-reverse;
}

/* =========================
   AVATAR
   ========================= */

.avatar {
  width: 40px;
  height: 40px;
  min-width: 40px;

  border-radius: 50%;

  background: #5865f2;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 14px;

  position: relative;

  overflow: hidden;

  border: 2px solid #303442;
}

.avatar img {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.avatar::after {
  content: "";

  position: absolute;

  inset: 0;

  border-radius: 50%;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08);

  pointer-events: none;
}

/* =========================
   MESSAGE CONTENT
   ========================= */

.message-content {
  display: flex;
  flex-direction: column;

  min-width: 0;
}

.message-row.mine .message-content {
  align-items: flex-end;
}

.message-username {
  font-size: 12px;

  color: #aeb4c0;

  margin: 0 0 5px 8px;

  font-weight: bold;
}

/* =========================
   MESSAGE BUBBLE
   ========================= */

.message {
  max-width: 100%;

  padding: 11px 15px;

  border-radius: 17px;

  background: #1b1e27;

  color: #f2f3f5;

  word-wrap: break-word;

  border: 1px solid #292d3a;

  box-shadow:
    0 3px 10px rgba(0, 0, 0, 0.25);

  transition: 0.2s;
}

.message:hover {
  border-color: #3a3f50;
}

.message-row.mine .message {
  background: #5865f2;

  color: white;

  border: none;

  border-bottom-right-radius: 5px;

  box-shadow:
    0 3px 12px rgba(88, 101, 242, 0.2);
}

.message-row:not(.mine) .message {
  border-bottom-left-radius: 5px;
}

.message-text {
  font-size: 15px;
  line-height: 1.45;
}

.message-time {
  font-size: 10px;

  color: #747b89;

  margin-top: 5px;

  padding: 0 4px;
}

/* =========================
   EDIT BUTTON
   ========================= */

.edit-button {
  margin-top: 5px;

  border: none;
  background: transparent;

  color: #747b89;

  font-size: 10px;

  cursor: pointer;

  padding: 2px 5px;

  transition: 0.2s;
}

.edit-button:hover {
  color: #5865f2;
}
    .message-actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.edit-button,
.delete-button {
  border: none;
  background: transparent;
  font-size: 10px;
  cursor: pointer;
  padding: 2px 5px;
  transition: 0.2s;
}

.edit-button {
  color: #747b89;
}

.edit-button:hover {
  color: #5865f2;
}

.delete-button {
  color: #747b89;
}

.delete-button:hover {
  color: #ed4245;
}

/* =========================
   READ RECEIPTS
   ========================= */

.read-receipt {
  font-size: 10px;

  margin-top: 3px;

  color: #8f96a3;
}

/* =========================
   EDITED LABEL
   ========================= */

.edited-label {
  font-size: 10px;

  color: #8f96a3;

  margin-left: 4px;

  font-style: italic;
}

/* =========================
   TYPING INDICATOR
   ========================= */

#typingIndicator {
  min-height: 22px;

  padding: 0 25px 7px;

  font-size: 12px;

  color: #8f96a3;

  font-style: italic;
}

/* =========================
   MESSAGE INPUT
   ========================= */

.send-area {
  display: flex;

  gap: 10px;

  padding: 15px 20px;

  background: #0d0f15;

  border-top: 1px solid #292d3a;
}

#messageInput {
  flex: 1;

  height: 48px;

  padding: 0 18px;

  border: 1px solid #292d3a;

  outline: none;

  border-radius: 24px;

  background: #171a22;

  color: white;

  font-size: 15px;

  transition: 0.2s;
}

#messageInput::placeholder {
  color: #6f7582;
}

#messageInput:focus {
  border-color: #5865f2;

  box-shadow:
    0 0 0 2px rgba(88, 101, 242, 0.15);
}

.send-area button {
  width: 48px;
  height: 48px;

  border: none;
  border-radius: 50%;

  background: #5865f2;

  color: white;

  font-size: 20px;

  cursor: pointer;

  transition: 0.2s;
}

.send-area button:hover {
  background: #4752c4;

  transform: scale(1.08);

  box-shadow:
    0 0 15px rgba(88, 101, 242, 0.35);
}

.send-area button:active {
  transform: scale(0.95);
}

/* =========================
   SCROLLBAR
   ========================= */

#messages::-webkit-scrollbar {
  width: 7px;
}

#messages::-webkit-scrollbar-track {
  background: transparent;
}

#messages::-webkit-scrollbar-thumb {
  background: #303442;

  border-radius: 10px;
}

#messages::-webkit-scrollbar-thumb:hover {
  background: #454b5c;
}
    
/* =========================
   PROFILE PANEL
   ========================= */

.profile-button {
  padding: 9px 14px;
  border: none;
  border-radius: 18px;
  background: #252936;
  color: #b5bac1;
  cursor: pointer;
  transition: 0.2s;
}

.profile-button:hover {
  background: #5865f2;
  color: white;
  transform: translateY(-1px);
}

.profile-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;

  align-items: center;
  justify-content: center;

  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
}

.profile-box {
  width: min(400px, 90%);
  padding: 25px;

  background: #15171f;
  border: 1px solid #292d3a;
  border-radius: 18px;

  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}

.profile-box h2 {
  margin-top: 0;
  margin-bottom: 20px;
}

.profile-box input,
.profile-box textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;

  border: 1px solid #292d3a;
  border-radius: 10px;

  background: #0d0f15;
  color: white;

  outline: none;
  font-family: Arial, sans-serif;
}

.profile-box textarea {
  height: 90px;
  resize: none;
}

.profile-box input:focus,
.profile-box textarea:focus {
  border-color: #5865f2;
}

.profile-buttons {
  display: flex;
  gap: 8px;
}

.profile-buttons button {
  flex: 1;
  padding: 10px;

  border: none;
  border-radius: 10px;

  background: #5865f2;
  color: white;

  cursor: pointer;
  font-weight: bold;
}

.profile-buttons button:last-child {
  background: #252936;
}

#profileStatus {
  text-align: center;
  color: #8f96a3;
  font-size: 12px;
  min-height: 15px;
}
    
/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

  #auth {
    padding: 40px 18px;
  }

  #auth h1 {
    font-size: 25px;
  }

  #messages {
    padding: 14px;
    gap: 12px;
  }

  .message-row {
    max-width: 90%;
  }

  .chat-header {
    padding: 0 10px;
  }

  .server-icon {
    width: 38px;
    height: 38px;
    min-width: 38px;
  }

  .chat-title {
    font-size: 15px;
  }

  .profile-setup input {
    display: none;
  }

  .logout-button {
    padding: 8px 10px;
    font-size: 11px;
  }

  .send-area {
    padding: 10px;
  }

  #messageInput {
    height: 44px;
  }

  .send-area button {
    width: 44px;
    height: 44px;
  }
}
    .message-actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.edit-button,
.delete-button {
  border: none;
  background: transparent;
  font-size: 10px;
  cursor: pointer;
  padding: 2px 5px;
  transition: 0.2s;
}

.edit-button {
  color: #747b89;
}

.edit-button:hover {
  color: #5865f2;
}

.delete-button {
  color: #747b89;
}

.delete-button:hover {
  color: #ed4245;
}
    .reaction-bar {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}

.reaction-button {
  background: #2b2d31;
  border: 1px solid #40444b;
  border-radius: 8px;
  padding: 4px 7px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.15s;
}

.reaction-button:hover {
  transform: scale(1.15);
  background: #40444b;
}
    .reaction-button.my-reaction {
  background: #5865f2;
  border-color: #7289da;
}
    .message-image {
  display: block;
  max-width: 280px;
  max-height: 350px;
  width: auto;
  height: auto;
  border-radius: 12px;
  margin-top: 8px;
  cursor: pointer;
}
    .image-preview {
  position: relative;
  display: inline-block;
  margin: 10px;
  padding: 6px;
  background: #1e1f22;
  border: 1px solid #40444b;
  border-radius: 12px;
}

.image-preview img {
  display: block;
  max-width: 220px;
  max-height: 180px;
  border-radius: 8px;
}

.remove-preview {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 25px;
  height: 25px;
  border: none;
  border-radius: 50%;
  background: #ed4245;
  color: white;
  font-size: 14px;
  cursor: pointer;
}
    .replied-message {
  background: #2b2d31;
  border-left: 3px solid #5865f2;
  padding: 6px 9px;
  margin-bottom: 7px;
  border-radius: 6px;
  font-size: 12px;
  opacity: 0.85;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
    
    .private-user-button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 6px;

  background: #2b2d31;
  color: white;

  border: 1px solid #40444b;
  border-radius: 8px;

  cursor: pointer;
  text-align: left;

  transition: 0.15s;
}

.private-user-button:hover {
  background: #40444b;
}

.private-user-avatar {
  width: 40px;
  height: 40px;

  border-radius: 50%;
  object-fit: cover;

  background: #1e1f22;
}

.private-user-button span {
  font-size: 15px;
  font-weight: 600;
}
    #privateMessages {
  height: 350px;
  overflow-y: auto;
  padding: 10px;
  margin-top: 10px;
  background: #1e1f22;
  border-radius: 8px;
}

.private-chat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.private-chat-header button {
  background: #2b2d31;
  color: white;
  border: 1px solid #40444b;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}

.private-chat-header span {
  font-weight: bold;
}

.private-message {
  width: fit-content;
  max-width: 75%;
  background: #2b2d31;
  color: white;
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: 10px;
}

.private-message.mine {
  margin-left: auto;
  background: #5865f2;
}

.private-send-area {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.private-send-area input {
  flex: 1;
  padding: 10px;
  background: #1e1f22;
  color: white;
  border: 1px solid #40444b;
  border-radius: 8px;
}

.private-send-area button {
  padding: 10px 14px;
  background: #5865f2;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
    .private-read-receipt {
  text-align: right;
  font-size: 11px;
  opacity: 0.65;
  margin-top: -4px;
  margin-bottom: 5px;
}

    .private-delete-button {
  margin-left: 8px;
  padding: 3px 6px;
  background: transparent;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  opacity: 0.7;
}

.private-delete-button:hover {
  background: #40444b;
  opacity: 1;
}

    .private-call-buttons {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

.private-call-buttons button {
  background: #2b2d31;
  color: white;
  border: 1px solid #40444b;
  border-radius: 6px;
  padding: 6px 9px;
  cursor: pointer;
  font-size: 16px;
}

.private-call-buttons button:hover {
  background: #40444b;
}
    .call-panel {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.call-box {
  width: min(900px, 95vw);
  background: #1e1f22;
  border: 1px solid #40444b;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.call-box h2 {
  margin-top: 0;
  color: white;
}

#remoteVideo {
  width: 100%;
  max-height: 60vh;
  background: #000;
  border-radius: 10px;
  object-fit: contain;
}

#localVideo {
  width: 180px;
  height: 130px;
  background: #000;
  border-radius: 10px;
  object-fit: cover;
  position: absolute;
  right: 30px;
  bottom: 100px;
  border: 2px solid white;
}

.call-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}

.call-controls button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #2b2d31;
  color: white;
}

.end-call-button {
  background: #d83c3e !important;
}
    /* ==============================
   NIGHTWIRE VISUAL POLISH
   ============================== */

/* Profile picture upload area */
.profile-setup {
  display: flex;
  align-items: center;
  gap: 8px;
}

.profile-setup input[type="file"] {
  max-width: 145px;
  padding: 7px;
  background: #181a20;
  color: #aeb4c0;
  border: 1px solid #30343d;
  border-radius: 8px;
  font-size: 12px;
}

.profile-setup input[type="file"]::file-selector-button {
  background: #5865f2;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 6px 9px;
  margin-right: 6px;
  cursor: pointer;
  font-weight: 600;
}

.profile-setup input[type="file"]::file-selector-button:hover {
  background: #4752c4;
}

/* Camera/upload button */
.profile-setup button {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: #5865f2;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
}

.profile-setup button:hover {
  background: #4752c4;
  transform: scale(1.06);
}

/* Top navigation buttons */
.profile-button {
  border: 1px solid #30343d;
  background: #20232b;
  color: #e8eaf0;
  border-radius: 22px;
  padding: 9px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s, border-color 0.15s;
}

.profile-button:hover {
  background: #2c303a;
  border-color: #5865f2;
  transform: translateY(-1px);
}

/* Profile window */
.profile-panel {
  backdrop-filter: blur(8px);
}

.profile-box {
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.55),
    0 0 30px rgba(88, 101, 242, 0.08);
}

/* Profile picture */
#profileAvatar {
  box-shadow:
    0 0 0 3px #15171d,
    0 0 0 5px #5865f2,
    0 8px 25px rgba(0, 0, 0, 0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}

#profileAvatar:hover {
  transform: scale(1.04);
}

/* Inputs */
input,
textarea {
  transition: border-color 0.15s, box-shadow 0.15s;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #5865f2 !important;
  box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.15);
}

/* Smoother scrollbar */
* {
  scrollbar-width: thin;
  scrollbar-color: #3b3f4a transparent;
}

*::-webkit-scrollbar {
  width: 7px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background: #3b3f4a;
  border-radius: 10px;
}

*::-webkit-scrollbar-thumb:hover {
  background: #5865f2;
}
    /* =========================================
   NIGHTWIRE — MAJOR VISUAL REDESIGN
   ========================================= */

/* Main page */
body {
  background:
    radial-gradient(circle at 15% 20%, rgba(88, 101, 242, 0.10), transparent 30%),
    radial-gradient(circle at 85% 80%, rgba(120, 70, 180, 0.08), transparent 30%),
    #08090d !important;
  color: #f2f3f5 !important;
}

/* Top navigation */
header,
.top-bar,
.navbar {
  background: rgba(13, 15, 22, 0.96) !important;

    // ===============================
// VOICE + VIDEO CALLING
// ===============================

let peerConnection = null;
let localStream = null;
let currentCallId = null;
let isMuted = false;
let cameraEnabled = true;

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
};

async function createPeerConnection() {
  peerConnection = new RTCPeerConnection(rtcConfig);

  peerConnection.onicecandidate = async event => {
    if (!event.candidate || !currentCallId || !currentPrivateUser) {
      return;
    }

    const { data: { user } } =
      await supabaseClient.auth.getUser();

    if (!user) return;

    await supabaseClient
      .from("call_signals")
      .insert({
        call_id: currentCallId,
        caller_id: user.id,
        receiver_id: currentPrivateUser.id,
        type: "candidate",
        payload: event.candidate.toJSON()
      });
  };

  peerConnection.ontrack = event => {
    const remoteVideo =
      document.getElementById("remoteVideo");

    if (remoteVideo) {
      remoteVideo.srcObject = event.streams[0];
    }
  };

  return peerConnection;
}

async function startVoiceCall() {
  await startCall(false);
}

async function startVideoCall() {
  await startCall(true);
}

async function startCall(withVideo) {
  if (!currentPrivateUser) {
    alert("Choose someone to call first.");
    return;
  }

  try {
    const { data: { user } } =
      await supabaseClient.auth.getUser();

    if (!user) {
      alert("You need to be logged in.");
      return;
    }

    currentCallId = crypto.randomUUID();

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: withVideo
      });

    const localVideo =
      document.getElementById("localVideo");

    localVideo.srcObject = localStream;

    if (!withVideo) {
      localVideo.style.display = "none";
    } else {
      localVideo.style.display = "block";
    }

    document.getElementById("callPanel").style.display = "flex";
    document.getElementById("callTitle").textContent =
      withVideo
        ? "📹 Calling " + currentPrivateUser.username + "..."
        : "📞 Calling " + currentPrivateUser.username + "...";

    await createPeerConnection();

    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });

    const offer =
      await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    await supabaseClient
      .from("call_signals")
      .insert({
        call_id: currentCallId,
        caller_id: user.id,
        receiver_id: currentPrivateUser.id,
     type: "offer",
payload: {
  sdp: offer.sdp,
  type: offer.type,
  video: withVideo,
  username: user.user_metadata?.username || "Caller"
}
      });

  } catch (error) {
    console.log("CALL ERROR:", error);
    alert(
      "Could not start the call:\n\n" +
      error.message
    );

    endCall();
  }
}

async function toggleMute() {
  if (!localStream) return;

  isMuted = !isMuted;

  localStream.getAudioTracks().forEach(track => {
    track.enabled = !isMuted;
  });

  document.getElementById("muteButton").textContent =
    isMuted ? "🔇 Unmute" : "🎙️ Mute";
}

async function toggleCamera() {
  if (!localStream) return;

  const videoTracks =
    localStream.getVideoTracks();

  if (videoTracks.length === 0) {
    return;
  }

  cameraEnabled = !cameraEnabled;

  videoTracks.forEach(track => {
    track.enabled = cameraEnabled;
  });

  document.getElementById("cameraButton").textContent =
    cameraEnabled ? "📷 Camera" : "🚫 Camera";
}

function endCall() {
  if (localStream) {
    localStream.getTracks().forEach(track => {
      track.stop();
    });
  }

  if (peerConnection) {
    peerConnection.close();
  }

  localStream = null;
  peerConnection = null;
  currentCallId = null;
  isMuted = false;
  cameraEnabled = true;

  const localVideo =
    document.getElementById("localVideo");

  const remoteVideo =
    document.getElementById("remoteVideo");

  if (localVideo) {
    localVideo.srcObject = null;
  }

  if (remoteVideo) {
    remoteVideo.srcObject = null;
  }

  document.getElementById("callPanel").style.display =
    "none";

  document.getElementById("muteButton").textContent =
    "🎙️ Mute";

  document.getElementById("cameraButton").textContent =
    "📷 Camera";
}

  if (!user) return;

  const { error } =
    await supabaseClient
      .from("private_messages")
      .delete()
      .eq("id", messageId)
      .eq("sender_id", user.id);

  if (error) {
    alert(
      "DELETE ERROR:\n\n" +
      error.message
    );
    console.log(error);
    return;
  }

  await loadPrivateMessages();
}
     let callRealtimeChannel = null;

async function startCallRealtime() {
  if (callRealtimeChannel) {
    supabaseClient.removeChannel(callRealtimeChannel);
  }

  callRealtimeChannel =
    supabaseClient
      .channel("call-signals-live")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "call_signals"
        },
        async payload => {
  await handleCallSignal(payload.new);
}
      )
     .subscribe((status, error) => {
  if (status === "SUBSCRIBED") {
    alert("📡 CALL REALTIME STATUS: SUBSCRIBED");
  } else {
    alert(
      "📡 REALTIME ERROR:\n\n" +
      status +
      "\n\n" +
      (error?.message || "No error message provided")
    );
  }
      });

} // closes startCallRealtime()

async function handleCallSignal(signal) {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) return;

  // Ignore signals that aren't meant for this user
  if (
    signal.receiver_id !== user.id &&
    signal.caller_id !== user.id
  ) {
    return;
  }
if (signal.type === "offer") {
  currentCallId = signal.call_id;

 currentPrivateUser = {
  id: signal.caller_id,
  username: signal.payload.username || "Caller"
};

  try {
    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: signal.payload.video === true
      });

    localStream = stream;

    await createPeerConnection();

    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });

    const localVideo =
      document.getElementById("localVideo");

    localVideo.srcObject = localStream;

    if (signal.payload.video === true) {
      localVideo.style.display = "block";
    } else {
      localVideo.style.display = "none";
    }

    document.getElementById(
      "callPanel"
    ).style.display = "flex";

    document.getElementById(
      "callTitle"
    ).textContent = "📞 Incoming call";

    document.getElementById(
      "incomingCallControls"
    ).style.display = "flex";

  } catch (error) {
    console.log("INCOMING CALL ERROR:", error);

    alert(
      "Could not receive the call:\n\n" +
      error.message
    );
  }

  return;
}
  
  if (signal.type === "answer") {
  if (!peerConnection) return;

  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(signal.payload)
  );

  document.getElementById(
    "callTitle"
  ).textContent = "📞 Connected";
}

if (signal.type === "candidate") {
  if (!peerConnection) return;

  try {
    await peerConnection.addIceCandidate(
      new RTCIceCandidate(signal.payload)
    );
  } catch (error) {
    console.log("ICE candidate error:", error);
  }
}
  
} // closes handleCallSignal()

startCallRealtime();

async function acceptCall() {
  if (!currentCallId || !peerConnection || !localStream) {
    console.log("No incoming call to accept.");
    return;
  }

  try {
    const { data: { user } } =
      await supabaseClient.auth.getUser();

    if (!user) return;

    const offerSignal =
      await supabaseClient
        .from("call_signals")
        .select("*")
        .eq("call_id", currentCallId)
        .eq("type", "offer")
        .maybeSingle();

    if (offerSignal.error || !offerSignal.data) {
      console.log("Could not find call offer.");
      return;
    }

    const offer = offerSignal.data.payload;

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    const answer =
      await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(answer);

    await supabaseClient
      .from("call_signals")
      .insert({
        call_id: currentCallId,
        caller_id: offerSignal.data.caller_id,
        receiver_id: user.id,
        type: "answer",
        payload: {
          type: answer.type,
          sdp: answer.sdp
        }
      });

    document.getElementById(
      "incomingCallControls"
    ).style.display = "none";

    document.getElementById(
      "callTitle"
    ).textContent = "📞 Connected";

  } catch (error) {
    console.log("ACCEPT CALL ERROR:", error);
    alert(
      "Could not accept the call:\n\n" +
      error.message
    );
    endCall();
  }
}
  
    async function declineCall() {
      console.log("Declining call...");
      endCall();
    }

  </script>
